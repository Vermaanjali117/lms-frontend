<!-- Floating Chat Button -->
<div class="fixed bottom-6 right-6 z-50">

    <!-- Chat Window -->
    @if (isOpen()) {
    <div class="bg-white rounded-2xl shadow-2xl border border-gray-200 w-80 mb-4 overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
                    🤖
                </div>
                <div>
                    <p class="text-white font-semibold text-sm">AI Assistant</p>
                    <p class="text-purple-200 text-xs">Always here to help!</p>
                </div>
            </div>
            <button (click)="toggleChat()" class="text-white/70 hover:text-white transition">
                ✕
            </button>
        </div>

        <!-- Messages -->
        <div class="h-72 overflow-y-auto p-4 space-y-3 bg-gray-50">
            @for (message of messages(); track $index) {
            <div class="flex" [class.justify-end]="message.role === 'user'"
                [class.justify-start]="message.role === 'ai'">
                <div class="max-w-[80%] px-4 py-2.5 rounded-2xl text-sm" [class.bg-purple-600]="message.role === 'user'"
                    [class.text-white]="message.role === 'user'" [class.rounded-br-none]="message.role === 'user'"
                    [class.bg-white]="message.role === 'ai'" [class.text-gray-700]="message.role === 'ai'"
                    [class.shadow-sm]="message.role === 'ai'" [class.rounded-bl-none]="message.role === 'ai'">
                    {{ message.content }}
                </div>
            </div>
            }

            <!-- Typing Indicator -->
            @if (isTyping()) {
            <div class="flex justify-start">
                <div class="bg-white shadow-sm px-4 py-2.5 rounded-2xl rounded-bl-none">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s">
                        </div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s">
                        </div>
                    </div>
                </div>
            </div>
            }
        </div>

        <!-- Input -->
        <div class="p-3 border-t border-gray-100 flex gap-2 bg-white">
            <input type="text" [(ngModel)]="userInput" (keypress)="onKeyPress($event)" placeholder="Ask anything..."
                class="flex-1 px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-purple-500" />
            <button (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping()"
                class="px-3 py-2 bg-purple-600 text-white rounded-xl hover:bg-purple-700 transition disabled:opacity-50">
                ➤
            </button>
        </div>
    </div>
    }

    <!-- Toggle Button -->
    <button (click)="toggleChat()"
        class="w-14 h-14 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-full shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center text-2xl hover:scale-110">
        @if (isOpen()) { ✕ } @else { 🤖 }
    </button>

</div>
